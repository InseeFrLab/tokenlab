[project]
name = "tokenlab"
version = "0.1.0"
description = "Outil de test de configurations Keycloak via un login standard flow (Authorization Code)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "httpx2==2.16.0",
    "jinja2==3.1.6",
    "pydantic-settings==2.16.2",
    "python-jose[cryptography]==3.5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
]
